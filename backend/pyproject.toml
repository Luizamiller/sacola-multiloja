[project]
name = "sacola-backend"
version = "2.0.0"
description = "Sacola Multi-loja — API de catálogo, sacola, pedidos e assistente com validação determinística."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "psycopg[binary]>=3.2",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
