name: Testes do assistente de pedido

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistente/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes (sem chave de API — o modelo é simulado)
        run: pytest -q
